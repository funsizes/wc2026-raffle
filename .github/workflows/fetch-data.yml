name: Fetch WC 2026 Match Data

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and commit match data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch match data from football-data.org
          curl -s \
            -H "X-Auth-Token: $FOOTBALL_API_KEY" \
            "https://api.football-data.org/v4/competitions/WC/matches" \
            -o matches.json

          # Get the current file SHA (required by GitHub API to update a file)
          SHA=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/data/matches.json" \
            | jq -r '.sha // empty')

          # Base64-encode the fetched data
          CONTENT=$(base64 -w 0 matches.json)

          # Build request body
          if [ -n "$SHA" ]; then
            BODY=$(jq -n \
              --arg msg "chore: update match data [skip ci]" \
              --arg content "$CONTENT" \
              --arg sha "$SHA" \
              '{message: $msg, content: $content, sha: $sha}')
          else
            BODY=$(jq -n \
              --arg msg "chore: update match data [skip ci]" \
              --arg content "$CONTENT" \
              '{message: $msg, content: $content}')
          fi

          # Commit via GitHub API
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/contents/data/matches.json" \
            -d "$BODY"
