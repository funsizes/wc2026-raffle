AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WC 2026 raffle — match fetch Lambda, schedule, assets bucket, optional DynamoDB

Parameters:
  ProjectTag:
    Type: String
    Default: wcsorteo2026
    Description: Value for the PROJECT tag applied to all stack resources

  AssetsBucketName:
    Type: String
    Default: wcsorteo2026-assets
    Description: S3 bucket for live match JSON and daily snapshots

  AppSecretsName:
    Type: String
    Default: wcsorteo2026/app-secrets
    Description: Secrets Manager name for app configuration and sensitive values (JSON)

  AnalyticsTimezone:
    Type: String
    Default: America/New_York
    Description: IANA timezone for daily snapshot date keys

  FetchScheduleExpression:
    Type: String
    Default: rate(1 minute)
    Description: EventBridge schedule that starts the fetch state machine (Lambda runs every 20s inside)

  FetchLambdaIntervalSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 59
    Description: Seconds between Lambda invocations inside each state machine run

  CreateSnapshotsTable:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create a DynamoDB table for future leaderboard snapshot storage

Conditions:
  CreateSnapshotsTable: !Equals [!Ref CreateSnapshotsTable, 'true']

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128
    Tags:
      PROJECT: !Ref ProjectTag

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AssetsBucketName
      Tags:
        - Key: PROJECT
          Value: !Ref ProjectTag
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins:
              - https://funsizes.github.io
              - https://dave9011.github.io
              - http://localhost:5173
              - http://127.0.0.1:5173
              - http://192.168.1.156:5173
              - http://192.168.50.166:5173
              - https://wcsorteo2026.com
              - https://www.wcsorteo2026.com
            ExposedHeaders:
              - ETag
              - x-amz-meta-custom-header
            MaxAge: 3000

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: FetchMatchesFunction
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${AssetsBucket.Arn}/*'
          - Sid: GrantUploadAccessToPrincipal
            Effect: Allow
            Principal:
              AWS: !GetAtt FetchMatchesFunctionRole.Arn
            Action: s3:PutObject
            Resource: !Sub '${AssetsBucket.Arn}/*'

  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref AppSecretsName
      Description: App secrets and sensitive configuration for wcsorteo2026 (JSON object)
      SecretString: '{"footballDataApiKey":"SET_ME_IN_SECRETS_MANAGER"}'
      Tags:
        - Key: PROJECT
          Value: !Ref ProjectTag

  FetchMatchesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: wcsorteo2026-fetch-matches
      Description: Fetches WC match data and writes live + daily snapshot objects to S3
      CodeUri: ../lambda/
      Handler: fetch-matches.handler
      Tags:
        PROJECT: !Ref ProjectTag
      Environment:
        Variables:
          ASSETS_BUCKET_NAME: !Ref AssetsBucket
          APP_SECRETS_ARN: !Ref AppSecrets
          ANALYTICS_TIMEZONE: !Ref AnalyticsTimezone
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AssetsBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AppSecrets

  FetchMatchesStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: wcsorteo2026-fetch-matches-scheduler
      Definition:
        Comment: !Sub 'Invoke fetch Lambda every ${FetchLambdaIntervalSeconds}s (EventBridge minimum is 1 minute)'
        StartAt: InvokeFetch1
        States:
          InvokeFetch1:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt FetchMatchesFunction.Arn
              InvocationType: Event
            ResultPath: null
            Next: WaitInterval1
          WaitInterval1:
            Type: Wait
            Seconds: 20
            Next: InvokeFetch2
          InvokeFetch2:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt FetchMatchesFunction.Arn
              InvocationType: Event
            ResultPath: null
            Next: WaitInterval2
          WaitInterval2:
            Type: Wait
            Seconds: 20
            Next: InvokeFetch3
          InvokeFetch3:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt FetchMatchesFunction.Arn
              InvocationType: Event
            ResultPath: null
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchMatchesFunction
      Tags:
        PROJECT: !Ref ProjectTag
      Events:
        FetchSchedule:
          Type: ScheduleV2
          Properties:
            Name: wcsorteo2026-fetch-matches-sfn-schedule
            Description: Start fetch state machine every minute (Lambda invoked every 20s inside)
            ScheduleExpression: !Ref FetchScheduleExpression
            ScheduleExpressionTimezone: America/New_York
            StartDate: '2026-06-24T16:30:00.000Z'
            EndDate: '2026-07-21T23:59:00.000Z'
            State: ENABLED

  SnapshotsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateSnapshotsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-snapshots'
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: PROJECT
          Value: !Ref ProjectTag
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

Outputs:
  ProjectTag:
    Description: PROJECT tag value applied to stack resources
    Value: !Ref ProjectTag

  AssetsBucketName:
    Description: S3 bucket for match JSON assets
    Value: !Ref AssetsBucket

  AssetsBucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt AssetsBucket.Arn

  AppSecretsArn:
    Description: Secrets Manager ARN for app secrets (JSON)
    Value: !Ref AppSecrets

  AppSecretsName:
    Description: Secrets Manager name for app secrets (JSON)
    Value: !Ref AppSecretsName

  FetchMatchesFunctionArn:
    Description: Match fetch Lambda ARN
    Value: !GetAtt FetchMatchesFunction.Arn

  FetchMatchesFunctionName:
    Description: Match fetch Lambda name
    Value: !Ref FetchMatchesFunction

  FetchMatchesStateMachineArn:
    Description: Step Functions state machine ARN for scheduled fetches
    Value: !Ref FetchMatchesStateMachine

  FetchMatchesStateMachineName:
    Description: Step Functions state machine name
    Value: !GetAtt FetchMatchesStateMachine.Name

  FetchScheduleExpression:
    Description: EventBridge schedule expression (starts the state machine)
    Value: !Ref FetchScheduleExpression

  FetchLambdaIntervalSeconds:
    Description: Seconds between Lambda invocations inside each state machine run
    Value: !Ref FetchLambdaIntervalSeconds

  SnapshotsTableName:
    Condition: CreateSnapshotsTable
    Description: DynamoDB table for snapshots (when enabled)
    Value: !Ref SnapshotsTable
